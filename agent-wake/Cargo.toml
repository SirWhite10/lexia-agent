[package]
name = "agent-wake"
version = "0.1.0"
edition = "2021"
default-run = "agent-wake"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.16"
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["static"] }

